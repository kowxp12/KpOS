# KpOS boot menu (GRUB)
# Look adapted from the PorteuX retro CRT menu.

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font

set timeout=3
set default=0

# Graphics menu. If the fonts can't load, GRUB uses the plain text menu.
if loadfont $prefix/fonts/kpos16.pf2 && loadfont $prefix/fonts/kpos28.pf2; then
    set gfxmode=1024x640,auto
    terminal_output gfxterm
    set theme=$prefix/themes/kpos/theme.txt
    export theme
fi

# KpOS draws in text mode itself, so GRUB must switch back
# to text before it starts the kernel.
set gfxpayload=text

menuentry "KpOS v0.0.7" --class kpos {
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Power off" --class halt {
    halt
}